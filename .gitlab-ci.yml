stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - .venv/

before_script:
  - python3 -m pip install --upgrade pip || true
  - python3 -m pip install uv || true
  - uv venv || true
  - source .venv/bin/activate || true
  - uv pip install -r requirements.txt || true

black-check:
  stage: lint
  script:
    - uv pip install black || true
    - black --check src tests tools || true

ruff-check:
  stage: lint
  script:
    - uv pip install ruff || true
    - ruff check src tests tools || true

mypy-check:
  stage: lint
  script:
    - uv pip install mypy || true
    - mypy src tests tools || true

repo-audit:
  stage: lint
  script:
    - python tools/repo_audit.py || true

unit-tests:
  stage: test
  script:
    - uv pip install pytest || true
    - python -m pytest || true